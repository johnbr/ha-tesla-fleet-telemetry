# Ruff configuration for the tesla_telemetry integration.
#
# The protobuf / flatbuffers bindings under proto/ are generated code,
# vendored verbatim from Tesla's schemas, and excluded from linting.
target-version = "py312"
line-length = 88
extend-exclude = ["custom_components/tesla_telemetry/proto"]

[lint.isort]
# Home Assistant convention: `homeassistant` imports get their own block
# between third-party packages and this integration's relative imports.
section-order = [
  "future",
  "standard-library",
  "third-party",
  "homeassistant",
  "first-party",
  "local-folder",
]

[lint.isort.sections]
homeassistant = ["homeassistant"]
