name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # No `ignore:`. The brands check is satisfied by the local
          # custom_components/tesla_telemetry/brand/ icons, and HACS
          # default requires every check to pass.
