---
# Service names, descriptions and field labels live in strings.json so they
# are translatable; this file carries only the schema Home Assistant needs to
# render the action form (required-ness, examples, selectors).
bootstrap:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: tesla_telemetry
    register_partner_domain:
      required: false
      default: true
      selector:
        boolean:
    ca_pem:
      required: false
      selector:
        text:
          multiline: true

resync_telemetry_config:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: tesla_telemetry
    ca_pem:
      required: false
      selector:
        text:
          multiline: true

get_telemetry_config:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: tesla_telemetry

dump_public_key:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: tesla_telemetry

set_interval_preset:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: tesla_telemetry
    preset:
      required: true
      selector:
        select:
          translation_key: interval_preset
          options:
            - default
            - high_rate
    ca_pem:
      required: false
      selector:
        text:
          multiline: true

navigate:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: tesla_telemetry
    destination:
      required: false
      example: "1 Tesla Road, Austin, TX"
      selector:
        text:
    latitude:
      required: false
      selector:
        number:
          min: -90
          max: 90
          step: any
          mode: box
    longitude:
      required: false
      selector:
        number:
          min: -180
          max: 180
          step: any
          mode: box
    order:
      required: false
      default: 0
      selector:
        select:
          translation_key: nav_order
          options:
            - "0"
            - "1"
            - "2"
            - "3"
    locale:
      required: false
      default: en-US
      example: de-DE
      selector:
        text:
